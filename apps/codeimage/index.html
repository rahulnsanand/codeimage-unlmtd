<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="theme-color" />
    <meta name="apple-mobile-web-app-status-bar-style" content="dark-content" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/assets/favicon.svg"
      as="image"
      type="image/svg+xml"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Overpass+Mono:wght@400;500;600&family=Source+Code+Pro:wght@400;500;600&family=Space+Mono:ital,wght@0,400;0,700;1,700&display=swap"
      rel="stylesheet"
      media="print"
      onload="
        this.onload = null;
        this.removeAttribute('media');
      "
      fetchpriority="low"
      crossorigin
    />

    <link
      href="/assets/fonts/geist_mono/GeistMono[wght].ttf"
      rel="preload"
      as="font"
      type="font/ttf"
      fetchpriority="low"
      crossorigin
    />

    <!-- Primary Meta Tags -->
    <title>CodeImage unlmtd</title>
    <meta
      name="title"
      content="CodeImage unlmtd - Generate Elegant Source Code Screenshots"
    />

      name="description"
      content="CodeImage unlmtd is the ultimate tool for developers to beautifully format, manage, and export source code snippets as high-resolution images for social media, blogs, and presentations."
    />
    <meta
      name="keywords"
      content="code screenshot, source code formatter, beautiful code, code snippet image generator, social media developer tools, programming visualization, codeimage unlmtd"
    />
    <meta name="author" content="CodeImage unlmtd Team" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://codeimageunlmtd.pages.dev/" />

    <!-- AI Documentation Links (llmstxt.org) -->
    <link
      rel="alternate"
      type="text/markdown"
      href="/llms.txt"
      title="CodeImage unlmtd AI documentation"
    />
    <link
      rel="alternate"
      type="text/markdown"
      href="/llms-full.txt"
      title="CodeImage unlmtd full AI documentation"
    />

    <!-- Web Manifest -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://codeimageunlmtd.pages.dev/" />

      property="og:title"
      content="CodeImage unlmtd - Generate Elegant Source Code Screenshots"
    />

      property="og:description"
      content="CodeImage unlmtd is the ultimate tool for developers to beautifully format, manage, and export source code snippets as high-resolution images for social media, blogs, and presentations."

      property="og:image"
      content="https://codeimageunlmtd.pages.dev/assets/codeimage_card.png"
    />
    <meta property="og:site_name" content="CodeImage unlmtd" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://codeimageunlmtd.pages.dev/" />
    <meta
      name="twitter:title"
      content="CodeImage unlmtd - Generate Elegant Source Code Screenshots"
    />
    <meta
      name="twitter:description"
      content="CodeImage unlmtd is the ultimate tool for developers to beautifully format, manage, and export source code snippets as high-resolution images for social media, blogs, and presentations."
    />
    <meta
      name="twitter:image"
      content="https://codeimageunlmtd.pages.dev/assets/codeimage_card.png"
    />

    <!-- JSON-LD Structured Data Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "CodeImage unlmtd",
        "url": "https://codeimageunlmtd.pages.dev/",
        "description": "CodeImage unlmtd is the ultimate tool for developers to beautifully format, manage, and export source code snippets as high-resolution images.",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "All",
        "offers": {

      body {
        margin: 0;
      }

      body {

      }

      .launcher {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100%;
        position: fixed;
        width: 100%;
        background-color: #111111;
      }

      .launcher img {
        opacity: 1;
      }

  <body>

    <div id="root">
